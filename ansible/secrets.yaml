---
# The workstation is the only source of the SOPS private key.
- name: Deliver SOPS age key to kuzco
  hosts: kuzco
  become: true
  vars:
    age_key_file: "{{ lookup('ansible.builtin.env', 'SOPS_AGE_KEY_FILE') }}"
  tasks:
    - name: Ensure Doco-CD config directory exists
      ansible.builtin.file:
        path: /etc/doco-cd
        state: directory
        mode: "0750"

    - name: Install age key
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.file', age_key_file) }}\n"
        dest: /etc/doco-cd/age.key
        owner: root
        group: root
        mode: "0400"
      no_log: true
      notify: Restart doco-cd

    - name: Ensure Doco-CD is running
      ansible.builtin.systemd:
        name: doco-cd.service
        enabled: true
        state: started

  handlers:
    - name: Restart doco-cd
      ansible.builtin.systemd:
        name: doco-cd.service
        state: restarted
