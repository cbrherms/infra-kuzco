---
- name: Install kernel headers and NVIDIA driver
  ansible.builtin.apt:
    name:
      - "linux-headers-{{ ansible_kernel }}"
      - "{{ nvidia_driver_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Blacklist nouveau
  ansible.builtin.copy:
    dest: /etc/modprobe.d/blacklist-nouveau.conf
    mode: "0644"
    content: |
      blacklist nouveau
      options nouveau modeset=0
  notify: Update initramfs

- name: Create nvidia-persistenced override directory
  ansible.builtin.file:
    path: /etc/systemd/system/nvidia-persistenced.service.d
    state: directory
    mode: "0755"

# The packaged unit starts the daemon with --no-persistence-mode, so the GPU still powers down its driver state when idle. Chasing very slow cold starts
- name: Enable GPU persistence mode in nvidia-persistenced
  ansible.builtin.copy:
    dest: /etc/systemd/system/nvidia-persistenced.service.d/persistence-mode.conf
    mode: "0644"
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/bin/nvidia-persistenced --user nvidia-persistenced --persistence-mode --verbose
  notify: Restart nvidia-persistenced

- name: Start NVIDIA persistence daemon
  ansible.builtin.systemd:
    name: nvidia-persistenced
    state: started
    daemon_reload: true
  failed_when: false

- name: Check whether a reboot is pending
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: gpu_reboot_required

- name: Report pending reboot
  ansible.builtin.debug:
    msg: "Reboot kuzco to load the NVIDIA driver."
  when: gpu_reboot_required.stat.exists
