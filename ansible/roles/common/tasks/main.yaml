---
- name: Require an SSH key before password login is disabled
  ansible.builtin.assert:
    that: admin_ssh_key | length > 0
    fail_msg: Set ANSIBLE_ADMIN_SSH_KEY in .mise.local.toml
    quiet: true

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - htop
      - jq
      - unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure admin user exists
  ansible.builtin.user:
    name: "{{ admin_user }}"
    shell: /bin/bash
    groups: sudo
    append: true

- name: Authorize admin SSH key
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ admin_ssh_key }}"

- name: Harden SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-kuzco.conf
    mode: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh
