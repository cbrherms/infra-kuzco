---
- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Add NVIDIA container toolkit apt key
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /etc/apt/keyrings/nvidia-container-toolkit.asc
    mode: "0644"

- name: Add NVIDIA container toolkit apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/nvidia-container-toolkit.asc]
      https://nvidia.github.io/libnvidia-container/stable/deb/{{ docker_arch }} /
    filename: nvidia-container-toolkit
    state: present

- name: Install Docker and NVIDIA container toolkit
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - nvidia-container-toolkit
    state: present
    update_cache: true

- name: Check whether the nvidia runtime is registered
  ansible.builtin.command: grep -q nvidia /etc/docker/daemon.json
  register: docker_nvidia_runtime
  changed_when: false
  failed_when: false

- name: Register nvidia runtime with Docker
  ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker
  when: docker_nvidia_runtime.rc != 0
  changed_when: true
  notify: Restart docker

- name: Add admin user to docker group
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: docker
    append: true

- name: Enable Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
