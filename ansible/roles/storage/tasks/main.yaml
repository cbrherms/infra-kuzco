---
- name: Check for an existing filesystem on the AI data disk
  ansible.builtin.command: blkid -o value -s TYPE {{ ai_data_device }}
  register: storage_blkid
  changed_when: false
  failed_when: storage_blkid.rc not in [0, 2]

- name: Format the AI data disk
  ansible.builtin.command: mkfs.ext4 -m 0 -L {{ ai_data_label }} {{ ai_data_device }}
  when: storage_blkid.stdout | length == 0
  changed_when: true

- name: Mount the AI data disk
  ansible.posix.mount:
    path: "{{ ai_data_mount }}"
    src: "LABEL={{ ai_data_label }}"
    fstype: ext4
    opts: defaults,noatime,nofail,x-systemd.device-timeout=30
    state: mounted
