# Control-workstation tooling only. Nothing here is installed on the endpoint.
[tools]
"aqua:casey/just" = "1.59.0"
"aqua:jqlang/jq" = "1.8.2"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:getsops/sops" = "3.13.3"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:pre-commit/pre-commit" = "4.7.0"
"pipx:yamllint" = "1.38.0"
"pipx:ansible-lint" = "26.10.1"
"pipx:ansible" = "14.5.0"
"aqua:docker/cli" = "29.9.2"
"aqua:docker/compose" = "5.6.1"

[env]
# Local connection details need to be overridden in .mise.local.toml.
KUZCO_HOST = "kuzco.local"
KUZCO_USER = "ubuntu"
ANSIBLE_ADMIN_USER = "ubuntu"
ANSIBLE_ADMIN_SSH_KEY = ""
ANSIBLE_AI_DATA_DEVICE = ""
SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/infra-kuzco.keys.txt"
ANSIBLE_CONFIG = "{{config_root}}/ansible/ansible.cfg"
ANSIBLE_INVENTORY = "{{config_root}}/ansible/inventory/hosts.yaml"

# Compose deployment: run docker/compose against the endpoint over SSH
DOCKER_HOST = "ssh://{{env.KUZCO_USER}}@{{env.KUZCO_HOST}}"
COMPOSE_PROJECT_DIR = "{{config_root}}/docker"
LOCAL_DOMAIN = ""
TRAEFIK_DOMAIN = ""
ACME_EMAIL = ""
