repos:
  - repo: local
    hooks:
      - id: sops-encrypted
        name: SOPS files are encrypted
        entry: scripts/check-sops.sh
        language: script
        files: '\.enc\.'
      - id: yamllint
        name: yamllint
        entry: yamllint
        language: system
        types: [yaml]
        exclude: '\.enc\.'
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
      - id: ansible-lint
        name: ansible-lint
        entry: ansible-lint ansible
        language: system
        pass_filenames: false
        files: ^ansible/
      - id: compose-config
        name: docker compose config
        entry: bash -c 'for f in docker/*/docker-compose.yaml; do env -u DOCKER_HOST docker compose -f "$f" config -q || exit 1; done'
        language: system
        pass_filenames: false
        files: ^docker/
