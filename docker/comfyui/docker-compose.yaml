services:
  comfyui:
    build:
      context: .
    image: kuzco/comfyui:local
    container_name: comfyui
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - "8188:8188"
    volumes:
      - /srv/ai/comfyui/models:/opt/ComfyUI/models
      - /srv/ai/comfyui/output:/opt/ComfyUI/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - "traefik.http.routers.comfyui.rule=Host(`comfyui.lan.${SECRET_DOMAIN:?Set SECRET_DOMAIN in mise config}`)"
      - traefik.http.routers.comfyui.entrypoints=websecure
      - traefik.http.routers.comfyui.tls=true
      - traefik.http.routers.comfyui.tls.certresolver=letsencrypt
      - traefik.http.services.comfyui.loadbalancer.server.port=8188
    networks:
      - proxy

networks:
  proxy:
    external: true
