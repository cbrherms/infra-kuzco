services:
  litellm:
    image: ghcr.io/berriai/litellm:1.106.2
    container_name: litellm
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    command:
      - --config
      - /app/config.yaml
      - --port
      - "4000"
    environment:
      # Allow adding models in the UI; credentials are encrypted with LITELLM_SALT_KEY (in the secrets file, never change it)
      STORE_MODEL_IN_DB: "true"
      LITELLM_MODE: PRODUCTION
      LITELLM_HIDE_DEFAULT_CREDENTIALS_HINT: "true"
      LITELLM_LOG: INFO
      LITELLM_TELEMETRY_DISABLED: "true"
      LITELLM_DONT_SHOW_FEEDBACK_BOX: "true"
    env_file:
      - path: litellm.secrets.enc.env
        required: true
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      litellm-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - "traefik.http.routers.litellm.rule=Host(`litellm.lan.${SECRET_DOMAIN:?Set SECRET_DOMAIN in mise config}`)"
      - traefik.http.routers.litellm.entrypoints=websecure
      - traefik.http.routers.litellm.tls=true
      - traefik.http.routers.litellm.tls.certresolver=letsencrypt
      - traefik.http.services.litellm.loadbalancer.server.port=4000
    networks:
      - proxy
      - llm

  litellm-db:
    image: postgres:18.6-alpine3.24
    container_name: litellm-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
    env_file:
      - path: postgres.secrets.enc.env
        required: true
    volumes:
      - /srv/ai/litellm/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "litellm", "-d", "litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - llm

networks:
  proxy:
    external: true
  llm:
    external: true
