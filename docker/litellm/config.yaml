# model_name matches the Ollama tag so the model behind each name is always obvious.
# num_ctx is forwarded to Ollama per model. Check `docker exec ollama ollama ps` for 100% GPU.
model_list:
  - model_name: deepseek-coder-v2:16b
    litellm_params:
      model: ollama_chat/MFDoom/deepseek-coder-v2-tool-calling:16b
      api_base: http://ollama:11434
      num_ctx: 8192

  - model_name: qwen2.5-coder:14b
    litellm_params:
      model: ollama_chat/qwen2.5-coder:14b
      api_base: http://ollama:11434
      num_ctx: 8192

  - model_name: deepseek-r1:14b
    litellm_params:
      model: ollama_chat/deepseek-r1:14b
      api_base: http://ollama:11434
      num_ctx: 8192

  - model_name: phi4:14b
    litellm_params:
      model: ollama_chat/phi4:14b
      api_base: http://ollama:11434
      num_ctx: 8192

  - model_name: qwen3.5:9b
    litellm_params:
      model: ollama_chat/qwen3.5:9b
      api_base: http://ollama:11434
      num_ctx: 8192

  - model_name: llama3.1:8b
    litellm_params:
      model: ollama_chat/llama3.1:8b
      api_base: http://ollama:11434
      num_ctx: 8192

  # External fallback:
  # - model_name: cloud-fallback
  #   litellm_params:
  #     model: openai/gpt-4.1-mini
  #     api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  callbacks: ["prometheus"]

router_settings:
  num_retries: 1
  timeout: 300
  # fallbacks: [{"qwen2.5-coder:14b": ["cloud-fallback"]}]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  disable_env_credential_login: true
  disable_spend_logs: false
  maximum_spend_logs_retention_period: 90d
