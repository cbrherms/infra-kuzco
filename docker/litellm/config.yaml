model_list:
  - model_name: local-coder
    litellm_params:
      model: ollama_chat/qwen2.5-coder:14b
      api_base: http://ollama:11434
      num_ctx: 8192 # per-model context; forwarded to Ollama as an option

  # External fallback: uncomment, add the provider key to litellm.secrets.enc.env, then enable `fallbacks` below.
  # - model_name: external-fallback
  #   litellm_params:
  #     model: openai/gpt-4.1-mini
  #     api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  callbacks: ["prometheus"]

router_settings:
  num_retries: 1
  timeout: 300
  # fallbacks: [{"local-coder": ["external-fallback"]}]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  disable_spend_logs: false
