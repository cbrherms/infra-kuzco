services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.2
    container_name: open-webui
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - "3000:8080"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    # Encrypted with SOPS; optional so the stack still starts before it exists (random session key)
    env_file:
      - path: secrets.enc.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /srv/ai/open-webui:/app/backend/data
