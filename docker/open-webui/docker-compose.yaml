services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.3
    container_name: open-webui
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - "3000:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      # PersistentConfig: only seeds the first start; later changes are made in Admin > Settings > Web Search
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: "https://search.${SECRET_DOMAIN:?Set SECRET_DOMAIN in mise config}/search"
      WEB_SEARCH_RESULT_COUNT: "3"
      WEB_SEARCH_CONCURRENT_REQUESTS: "3"
    env_file:
      - path: secrets.enc.env
        required: false
    volumes:
      - /srv/ai/open-webui:/app/backend/data
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - "traefik.http.routers.open-webui.rule=Host(`chat.${TRAEFIK_DOMAIN:?Set TRAEFIK_DOMAIN in mise config}`)"
      - traefik.http.routers.open-webui.entrypoints=websecure
      - traefik.http.routers.open-webui.tls=true
      - traefik.http.routers.open-webui.tls.certresolver=letsencrypt
      - traefik.http.services.open-webui.loadbalancer.server.port=8080
    networks:
      - proxy
      - llm

networks:
  proxy:
    external: true
  llm:
    external: true
