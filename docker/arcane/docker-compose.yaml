services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:v2.16.1
    restart: unless-stopped
    container_name: arcane
    ports:
      - '3552:3552'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/ai/arcane/data:/app/data
      - /opt/docker:/opt/docker
    environment:
      - PUID=1000
      - PGID=1000
      - PROJECTS_DIRECTORY=/opt/docker
    env_file:
      - path: secrets.enc.env
        required: false
    cgroup: host
