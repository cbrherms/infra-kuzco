services:
  ollama:
    image: ollama/ollama:0.40.17
    container_name: ollama
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - "11434:11434"
    environment:
      TZ: Europe/London
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - "traefik.http.routers.ollama.rule=Host(`ollama.lan.${SECRET_DOMAIN:?Set SECRET_DOMAIN in mise config}`)"
      - traefik.http.routers.ollama.entrypoints=websecure
      - traefik.http.routers.ollama.tls=true
      - traefik.http.routers.ollama.tls.certresolver=letsencrypt
      - traefik.http.services.ollama.loadbalancer.server.port=11434
    networks:
      - llm
      - proxy

volumes:
  ollama-data:
    name: kuzco-ollama-data

networks:
  llm:
    external: true
  proxy:
    external: true
