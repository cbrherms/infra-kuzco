name: secrets

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check *.enc.* files are encrypted
        run: scripts/check-sops.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
